name: Adsun Hourly Scrape

on:
  schedule:
    - cron: "23 * * * *"   # phut thu 23 cua MOI GIO (gio UTC) — tranh dau gio (phut 0-10) la luc GitHub de bi tre lich nhat
    # 2 lich chay phu, cach nhau ~20 phut — GitHub Actions cron la "best
    # effort", thuc te da gap NHIEU LAN GitHub tu ngung kich hoat lich TRONG
    # VAI GIO LIEN TIEP (khong phai chi tre vai phut nhu truoc) du workflow
    # van "active" binh thuong (xac nhan ngay 10/8 VA 12/8: co lan khong
    # chay lan nao tu 23:48 den hon 2 gio sau, lan khac ~1.5 gio). 3 lich/gio
    # giam manh kha nang CA 3 cung bi bo lo trong cung 1 gio.
    - cron: "43 * * * *"
    - cron: "58 * * * *"
  workflow_dispatch:       # cho phep bam "Run workflow" thu cong tren GitHub,
    inputs:                # hoac web app tu kich hoat qua GitHub API (xem
      mode:                 # github_dispatch.py) khi bam "Cap nhat ngay" /
        description: "scrape (mac dinh) hoac recompute"   # "Cap nhat theo khoang"
        required: false
        default: "scrape"
      range_start:
        description: "YYYY-MM-DD HH:MM (tuy chon — de trong = cua so binh thuong)"
        required: false
      range_end:
        description: "YYYY-MM-DD HH:MM (tuy chon, phai di kem range_start)"
        required: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Reconstruct Google service account credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_CREDENTIALS_JSON" > google_credentials.json

      - name: Run scraper
        env:
          ADSUN_USER: ${{ secrets.ADSUN_USER }}
          ADSUN_PASS: ${{ secrets.ADSUN_PASS }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          MODE: ${{ github.event.inputs.mode }}
          RANGE_START: ${{ github.event.inputs.range_start }}
          RANGE_END: ${{ github.event.inputs.range_end }}
        run: |
          if [ "$MODE" = "recompute" ]; then
            echo "Chay recompute_zones.py (tinh lai vung tu cache tren Google Drive, khong quet Adsun)"
            python recompute_zones.py
          elif [ -n "$RANGE_START" ] && [ -n "$RANGE_END" ]; then
            echo "Chay refresh_range.py cho khoang: $RANGE_START -> $RANGE_END"
            python refresh_range.py --from "$RANGE_START" --to "$RANGE_END"
          else
            echo "Chay adsun_daily_report.py (cua so binh thuong)"
            python adsun_daily_report.py
          fi
