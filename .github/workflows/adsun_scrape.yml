name: Adsun Hourly Scrape

on:
  schedule:
    - cron: "5 * * * *"   # phut thu 5 cua MOI GIO (gio UTC)
  workflow_dispatch:       # cho phep bam "Run workflow" thu cong tren GitHub,
    inputs:                # hoac web app tu kich hoat qua GitHub API (xem
      mode:                 # github_dispatch.py) khi bam "Cap nhat ngay" /
        description: "scrape (mac dinh) hoac recompute"   # "Cap nhat theo khoang"
        required: false
        default: "scrape"
      range_start:
        description: "YYYY-MM-DD HH:MM (tuy chon — de trong = cua so binh thuong)"
        required: false
      range_end:
        description: "YYYY-MM-DD HH:MM (tuy chon, phai di kem range_start)"
        required: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Reconstruct Google service account credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_CREDENTIALS_JSON" > google_credentials.json

      - name: Run scraper
        env:
          ADSUN_USER: ${{ secrets.ADSUN_USER }}
          ADSUN_PASS: ${{ secrets.ADSUN_PASS }}
          RANGE_START: ${{ github.event.inputs.range_start }}
          RANGE_END: ${{ github.event.inputs.range_end }}
        run: |
          if [ -n "$RANGE_START" ] && [ -n "$RANGE_END" ]; then
            echo "Chay refresh_range.py cho khoang: $RANGE_START -> $RANGE_END"
            python refresh_range.py --from "$RANGE_START" --to "$RANGE_END"
          else
            echo "Chay adsun_daily_report.py (cua so binh thuong)"
            python adsun_daily_report.py
          fi
